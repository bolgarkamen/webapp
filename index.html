<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>АвтоРулетка</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="app-container">
        <header>
            <h1>🏎️ АвтоРулетка</h1>
            <div class="balance">Баланс: <span id="balance">1000</span> 🪙</div>
        </header>

        <!-- Главный экран с кейсами -->
        <div class="menu-screen" id="menu-screen">
            <h2>Выбери кейс:</h2>
            <div class="cases-grid">
                <div class="case-item" onclick="openCase('Обычный', 100)">
                    <div class="case-icon">📦</div>
                    <h3>Обычный</h3>
                    <p>100 🪙</p>
                </div>
                <div class="case-item" onclick="openCase('Редкий', 500)">
                    <div class="case-icon">🎁</div>
                    <h3>Редкий</h3>
                    <p>500 🪙</p>
                </div>
                <div class="case-item" onclick="openCase('Легендарный', 2000)">
                    <div class="case-icon">💎</div>
                    <h3>Легендарный</h3>
                    <p>2000 🪙</p>
                </div>
            </div>
            
            <button class="btn-roulette" onclick="goToRoulette()">🎰 Перейти к Рулетке</button>
            <button class="btn-roulette" onclick="goToGarage()" style="background: #2b3e4e; margin-top: 10px;">🚗 Мой Гараж</button>
        </div>

        <!-- Экран Гаража -->
        <div class="garage-screen" id="garage-screen" style="display: none;">
            <h2>🚗 Мой Гараж</h2>
            <div id="garage-list" style="display: flex; flex-direction: column; gap: 10px; margin-top: 20px;">
                <!-- Сюда будут добавляться машины -->
            </div>
            <button class="btn-back" onclick="goToMenu()" style="margin-top: 20px;">⬅️ Назад в меню</button>
        </div>

        <!-- Экран кейсов (результат) -->
        <div class="roulette-screen" id="roulette-screen" style="display: none; text-align: center;">
            <h2 id="roulette-title">Крутим кейс...</h2>
            <div id="car-result" style="margin: 30px auto; padding: 20px; background: #2b3e4e; border-radius: 15px; width: 200px; display: none;">
                <h3 id="car-name" style="color: #ffd700; font-size: 20px;"></h3>
                <p id="car-details" style="color: #ccc; margin-top: 10px;"></p>
            </div>
            <button class="btn-back" onclick="goToMenu()" id="back-btn" style="display: none; margin-top: 20px;">⬅️ Забрать и выйти</button>
        </div>

        <!-- НОВЫЙ Экран: Настоящая Рулетка -->
        <div class="roulette-game-screen" id="roulette-game-screen" style="display: none;">
            <h2>Крути Рулетку!</h2>
            <p>Стоимость: 100 🪙</p>
            
            <div class="roulette-window" style="overflow: hidden; background: #1e2732; padding: 20px 0; border-radius: 10px; margin: 20px 0; position: relative;">
                <div id="roulette-track" style="display: flex; transition: transform 3s cubic-bezier(0.1, 0.7, 0.1, 1);">
                    <!-- Сюда будут добавляться машины -->
                </div>
                <div style="position: absolute; top: 0; bottom: 0; left: 50%; width: 4px; background: #ffd700; transform: translateX(-50%); z-index: 10;"></div>
            </div>

            <button class="btn-roulette" id="spin-btn" onclick="spinRoulette()" style="background: #ffd700; color: #000;">Крутить за 100 🪙</button>
            <button class="btn-back" onclick="goToMenu()">⬅️ Назад в меню</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
