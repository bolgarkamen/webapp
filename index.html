<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>АвтоРулетка</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="app-container">
        <header>
            <h1>🏎️ АвтоРулетка</h1>
            <div class="balance">Баланс: <span id="balance">1000</span> 🪙</div>
        </header>

        <!-- Главный экран с кейсами -->
        <div class="menu-screen" id="menu-screen">
            <h2>Выбери кейс:</h2>
            <div class="cases-grid">
                <div class="case-item" onclick="openCase('Обычный', 100)">
                    <div class="case-icon">📦</div>
                    <h3>Обычный</h3>
                    <p>100 🪙</p>
                </div>
                <div class="case-item" onclick="openCase('Редкий', 500)">
                    <div class="case-icon">🎁</div>
                    <h3>Редкий</h3>
                    <p>500 🪙</p>
                </div>
                <div class="case-item" onclick="openCase('Легендарный', 2000)">
                    <div class="case-icon">💎</div>
                    <h3>Легендарный</h3>
                    <p>2000 🪙</p>
                </div>
            </div>
            <button class="btn-roulette" onclick="goToRoulette()">🎰 Перейти к Рулетке</button>
        </div>

        <!-- Экран рулетки (появится при нажатии) -->
        <div class="roulette-screen" id="roulette-screen" style="display: none; text-align: center;">
            <h2 id="roulette-title">Крутим кейс...</h2>
            
            <!-- Окно с результатом -->
            <div id="car-result" style="margin: 30px auto; padding: 20px; background: #2b3e4e; border-radius: 15px; width: 200px; display: none;">
                <h3 id="car-name" style="color: #ffd700; font-size: 20px;"></h3>
                <p id="car-details" style="color: #ccc; margin-top: 10px;"></p>
            </div>

            <button class="btn-back" onclick="goToMenu()" id="back-btn" style="display: none; margin-top: 20px;">⬅️ Забрать и выйти</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
