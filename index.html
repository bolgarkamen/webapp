        <!-- Экран Рулетки -->
        <div class="roulette-game-screen" id="roulette-game-screen" style="display: none;">
            <h2>Крути Рулетку!</h2>
            <p style="margin-bottom: 10px;">Стоимость: 100 🪙</p>
            
            <!-- Окно рулетки -->
            <div class="roulette-window" style="position: relative; overflow: hidden; background: #111; border: 2px solid #333; padding: 30px 0; border-radius: 15px; margin: 20px 0; box-shadow: inset 0 0 20px #000;">
                <!-- Лента -->
                <div id="roulette-track" style="display: flex; transition: transform 4s cubic-bezier(0.1, 0.7, 0.1, 1);"></div>
                
                <!-- Золотой указатель -->
                <div style="position: absolute; top: 0; bottom: 0; left: 50%; width: 4px; background: #ffd700; transform: translateX(-50%); z-index: 10; box-shadow: 0 0 15px #ffd700;"></div>
                
                <!-- Затемнение по краям -->
                <div style="position: absolute; top: 0; left: 0; width: 50px; height: 100%; background: linear-gradient(to right, #111, transparent); z-index: 5;"></div>
                <div style="position: absolute; top: 0; right: 0; width: 50px; height: 100%; background: linear-gradient(to left, #111, transparent); z-index: 5;"></div>
            </div>

            <button class="btn-roulette" id="spin-btn" onclick="spinRoulette()" style="background: linear-gradient(135deg, #ffd700, #ff8c00); color: #000; font-size: 20px; padding: 18px;">Крутить за 100 🪙</button>
            <button class="btn-back" onclick="goToMenu()">⬅️ Назад в меню</button>
        </div>
